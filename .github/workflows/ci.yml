name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build validates `externalBin` in its build script, so the rclone
      # sidecar has to exist before `cargo check` — not just before bundling.
      # Keyed on the script's hash, not a literal version: the sidecar filename
      # carries no version, so a stale cache would otherwise satisfy the
      # "already present" check and silently pin an old rclone after a bump.
      - name: Cache sync sidecar
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: rclone-${{ matrix.os }}-${{ hashFiles('scripts/fetch-binaries.ps1') }}

      - name: Fetch sync sidecar
        shell: pwsh
        run: ./scripts/fetch-binaries.ps1 -RcloneOnly

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml
